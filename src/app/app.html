<!-- TOP NAVIGATION LOADING PROGRESS BAR -->
@if (isNavigating()) {
  <div class="top-nav-loader" aria-hidden="true"></div>
}

<!-- GLOBAL BACKGROUND DECORATION -->
<div class="bg-decor">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="grid-bg"></div>
</div>

<!-- UNIVERSAL TOP NAVIGATION BAR -->
<app-navbar></app-navbar>

<div class="app-layout">
  <app-sidebar></app-sidebar>

  <div class="main-column">
    <!-- MAIN APP ROUTER CONTENT -->
    <main class="app-main-content">
      <router-outlet></router-outlet>
      @if (isEnglishBmi) {
        <a [routerLink]="hindiBmi" lang="hi-IN" hreflang="hi-IN">बीएमआई कैलकुलेटर हिंदी में</a>
      }
      @if (hubTools; as tools) {
        @if (tools.length) {
          <nav aria-label="Tools in this category">
            <h2>Tools in this category</h2>
            <ul>
              @for (tool of tools; track tool.slug) {
                <li>
                  <a [routerLink]="tool.slug" (pointerenter)="prefetchTool(tool.slug)" (focus)="prefetchTool(tool.slug)">
                    {{ tool.name }}
                  </a>
                </li>
              }
            </ul>
          </nav>
        }
      }
      <app-tool-seo-content></app-tool-seo-content>
    </main>

    <!-- UNIVERSAL FOOTER -->
    <app-footer></app-footer>
  </div>

  @defer (on idle) {
    <app-right-sidebar></app-right-sidebar>
  }
</div>

<!-- GLOBAL COOKIE CONSENT BANNER (ADSENSE & GDPR COMPLIANT) -->
<app-cookie-consent></app-cookie-consent>
