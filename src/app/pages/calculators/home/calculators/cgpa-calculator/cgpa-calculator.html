<div class="calculator-container">
  <h2 class="calculator-title">🎓 CGPA Calculator</h2>
  <p class="calculator-subtitle">Calculate CGPA and convert to percentage</p>

  <div class="semesters-list">
    <div class="semester-row" *ngFor="let sem of semesters; let i = index">
      <span class="semester-label">Semester {{ i + 1 }}</span>
      
      <div class="row-inputs">
        <div class="input-group">
          <input
            type="number"
            class="input-field-small"
            [(ngModel)]="sem.sgpa"
            (ngModelChange)="calculateCgpa()"
            placeholder="SGPA (e.g. 8.5)"
            min="0"
            max="10"
            step="0.01"
          />
        </div>
        
        <div class="input-group">
          <input
            type="number"
            class="input-field-small"
            [(ngModel)]="sem.credits"
            (ngModelChange)="calculateCgpa()"
            placeholder="Credits (Optional)"
            min="0"
          />
        </div>

        <button class="remove-btn" (click)="removeSemester(i)" *ngIf="semesters.length > 1">✕</button>
      </div>
    </div>
  </div>

  <div class="actions-container">
    <button class="add-btn" (click)="addSemester()">+ Add Semester</button>
  </div>

  <div class="results-container" *ngIf="cgpa !== null">
    <div class="primary-result">
      <div class="result-value">{{ cgpa }}</div>
      <div class="result-label">Cumulative GPA (CGPA)</div>
    </div>

    <div class="details-grid">
      <div class="detail-card">
        <span class="detail-label">Approx Percentage</span>
        <span class="detail-value" style="color: #63b3ed;">{{ percentage }}%</span>
      </div>
      <div class="detail-card">
        <span class="detail-label">Formula Used</span>
        <span class="detail-value" style="font-size: 0.9rem;">CGPA × 9.5</span>
      </div>
    </div>
  </div>
</div>
