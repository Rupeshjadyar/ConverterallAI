<div class="tool-container">
  <a routerLink="/pdf-processing" class="back-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back to Dashboard
  </a>

  <div class="tool-header animate-fade-in">
    <div class="badge">
      <span class="badge-dot local"></span>
      100% Secure In-Browser Processing
    </div>
    <h1>📄 Text to PDF</h1>
    <p class="tool-desc">Convert plain text into a professionally formatted PDF document.</p>
  </div>

  <div class="main-card glass animate-fade-in-up">
    <!-- Text Input Area (always visible when no result) -->
    <div *ngIf="!isConverting && !convertedUrl">
      <div style="margin-bottom: 1.5rem;">
        <label class="form-label" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Type or paste your text below:</label>
        <textarea 
          [(ngModel)]="textInput"
          placeholder="Enter your text here... You can also drag & drop a .txt file."
          style="width: 100%; min-height: 280px; padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-color); font-family: 'Inter', sans-serif; font-size: 0.95rem; resize: vertical; outline: none; transition: border-color 0.2s;"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
        ></textarea>
      </div>

      <!-- Or upload txt file -->
      <div style="text-align: center; margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.85rem;">
        Or <button style="background:none; border:none; color: var(--primary-color); cursor: pointer; font-weight: 600; text-decoration: underline;" (click)="txtInput.click()">upload a .txt file</button>
        <input #txtInput type="file" style="display:none;" accept=".txt,text/plain" (change)="onFileSelected($event)" />
      </div>

      <!-- Font Size -->
      <div class="tool-settings" style="margin-bottom: 1.5rem;">
        <div class="settings-title">⚙️ Options</div>
        <div class="form-group">
          <label class="form-label">Font Size (pt)</label>
          <select class="form-input" [(ngModel)]="fontSize">
            <option [value]="10">10pt - Small</option>
            <option [value]="12">12pt - Normal</option>
            <option [value]="14">14pt - Large</option>
            <option [value]="16">16pt - Extra Large</option>
          </select>
        </div>
      </div>

      <div class="action-area">
        <button class="btn-action" (click)="processFiles()" [disabled]="!textInput.trim()">
          <span>Generate PDF</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Processing -->
    <div *ngIf="isConverting" class="action-area">
      <div class="progress-container">
        <div class="progress-header">
          <span>Generating PDF...</span>
          <span>{{ progress }}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" [style.width.%]="progress"></div>
        </div>
      </div>
    </div>

    <!-- Success -->
    <div *ngIf="convertedUrl" class="success-card">
      <div class="success-icon">✓</div>
      <h3 class="success-title">PDF Generated Successfully!</h3>
      <p style="color: var(--text-secondary);">Your text has been converted to a professionally formatted PDF document.</p>
      
      <button class="btn-action btn-download" (click)="download()">
        <span>Download PDF</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></path>
        </svg>
      </button>

      <button class="reset-link" (click)="resetState(true)">Convert another text</button>
    </div>
  </div>
</div>
